[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salt-pepper"
version = "4.12.0"
description = "A modern CLI front-end for salt-api"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

authors = [
    { name = "Aaron Greengrass", email = "aaron@greenbtn.com" },
    { name = "Seth House", email = "shouse@saltstack.com" },
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Clustering",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
    "requests>=2.25",
]

[project.optional-dependencies]
kerberos = ["requests-gssapi>=1.1.0"]
dev = [
    "pytest>=7",
    "pytest-mock>=3",
    "pytest-asyncio>=1.2.0",
    "responses>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/greenaar/salt-pepper"
Source = "https://github.com/greenaar/salt-pepper"

[project.scripts]
pepper = "salt_pepper.script:main"

[tool.hatch.build.targets.wheel]
packages = ["src/salt_pepper"]

[tool.hatch.build]
artifacts = ["scripts/pepper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".nox", ".venv", "src"]
addopts = "--showlocals -ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = false
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

