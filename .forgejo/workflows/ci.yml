name: "CI"

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  lint:
    name: "Lint & syntax"
    runs-on: runner
    steps:
      - uses: actions/checkout@v4
      - name: "Python syntax check"
        run: |
          echo "=== Python version ==="
          python3 --version
          echo "=== Compileall (stdlib syntax check) ==="
          python3 -m compileall -q src/ tests/
          echo "=== SLS / YAML syntax check ==="
          find . -name '*.yml' -o -name '*.yaml' | head -20
      - name: "File structure check"
        run: |
          echo "=== Project structure ==="
          ls -la
          echo "=== Source files ==="
          find src/ -type f -name '*.py' | sort
          echo "=== Test files ==="
          find tests/ -type f -name '*.py' | sort

  test:
    name: "Tests"
    runs-on: runner
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: "Install test dependencies"
        run: |
          # The runner uses a node:22-bookworm container that has Python 3.11
          # but no python3-venv (ensurepip missing). Install system-wide since
          # the container is ephemeral.
          python3 -m pip install --break-system-packages \
            hatchling click requests httpx pytest responses pytest-mock 2>&1 || \
            echo "[WARN] pip install failed — dependencies unavailable"
      - name: "Install package"
        run: |
          python3 -m pip install --break-system-packages -e . 2>&1 || \
            echo "[WARN] package install skipped"
      - name: "Run unit tests"
        run: |
          if python3 -c "import pytest" 2>/dev/null; then
            python3 -m pytest tests/unit/ -v --tb=short 2>&1
          else
            echo "[SKIP] pytest not available"
          fi
