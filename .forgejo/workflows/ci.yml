name: "CI"

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  lint:
    name: "Lint & type check"
    runs-on: runner
    steps:
      - uses: actions/checkout@v4
      - name: "Python syntax check"
        run: |
          echo "=== Python version ==="
          python3 --version
          echo "=== Compileall (stdlib syntax check) ==="
          python3 -m compileall -q src/ tests/
      - name: "Install lint dependencies"
        run: |
          apt-get update -qq 2>/dev/null && apt-get install -y -qq \
            python3-pip python3-hatchling 2>&1 || \
            echo "[WARN] apt install failed"
          pip3 install --break-system-packages \
            ruff mypy types-requests 2>&1 || \
            echo "[WARN] pip install failed"
      - name: "Ruff check"
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check src/ && echo "✓ Ruff passed" || echo "[WARN] Ruff found issues"
          else
            echo "[SKIP] ruff not available"
          fi
      - name: "Mypy check"
        run: |
          if command -v mypy >/dev/null 2>&1; then
            mypy src/ && echo "✓ Mypy passed" || echo "[WARN] Mypy found issues"
          else
            echo "[SKIP] mypy not available"
          fi

  test:
    name: "Tests"
    runs-on: runner
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: "Install test dependencies"
        run: |
          # Runner uses node:22-bookworm Docker container. It has Python 3.11
          # but not python3-pip or python3-venv. Install via apt first.
          apt-get update -qq 2>/dev/null && apt-get install -y -qq python3-pip \
            python3-hatchling python3-click python3-requests python3-pytest 2>&1 || \
            echo "[WARN] apt install failed"
          # Install test-only packages not available as Debian packages.
          pip3 install --break-system-packages \
            responses pytest-mock pytest-asyncio 2>&1 || \
            echo "[WARN] pip install failed"
      - name: "Install package"
        run: |
          if command -v pip3 >/dev/null 2>&1; then
            pip3 install --break-system-packages -e . 2>&1
          else
            echo "[SKIP] pip not available"
            exit 1
          fi
      - name: "Run unit tests"
        run: |
          if python3 -c "import pytest, responses" 2>/dev/null; then
            python3 -m pytest tests/unit/ -v --tb=short 2>&1
          else
            echo "[SKIP] missing dependencies"
            exit 1
          fi
