name: "CI"

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  lint:
    name: "Lint & syntax"
    runs-on: runner
    steps:
      - uses: actions/checkout@v4
      - name: "Python syntax check"
        run: |
          echo "=== Python version ==="
          python3 --version
          echo "=== Compileall (stdlib syntax check) ==="
          python3 -m compileall -q src/ tests/
          echo "=== SLS / YAML syntax check ==="
          find . -name '*.yml' -o -name '*.yaml' | head -20
      - name: "File structure check"
        run: |
          echo "=== Project structure ==="
          ls -la
          echo "=== Source files ==="
          find src/ -type f -name '*.py' | sort
          echo "=== Test files ==="
          find tests/ -type f -name '*.py' | sort

  test:
    name: "Tests"
    runs-on: runner
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: "Install build dependencies"
        run: |
          python3 -m venv /tmp/ci-venv
          /tmp/ci-venv/bin/pip install hatchling click requests httpx pytest responses pytest-mock 2>&1 || \
            echo "[WARN] pip install failed (expected on no-internet runner)"
      - name: "Install package"
        run: |
          if [ -f /tmp/ci-venv/bin/pip ]; then
            /tmp/ci-venv/bin/pip install -e . 2>&1 || echo "[WARN] package install skipped"
          fi
      - name: "Run unit tests"
        run: |
          if [ -f /tmp/ci-venv/bin/pytest ]; then
            /tmp/ci-venv/bin/pytest tests/unit/ -v --tb=short 2>&1
          else
            echo "[SKIP] pytest not available — no-internet runner"
          fi
