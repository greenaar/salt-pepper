name: "CI"

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  lint:
    name: "Lint & type check"
    runs-on: runner
    container:
      image: catthehacker/ubuntu:act-24.04
    steps:
      - uses: actions/checkout@v4
      - name: "Python syntax check"
        run: |
          python3 --version
          python3 -m compileall -q src/ tests/
      - name: "Install lint tools"
        run: |
          pip3 install --break-system-packages \
            ruff mypy types-requests 2>&1 || \
            echo "[WARN] pip install failed"
      - name: "Ruff check"
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check src/ && echo "✓ Ruff passed" || echo "[WARN] Ruff found issues"
          else
            echo "[SKIP] ruff not available"
          fi
      - name: "Mypy check"
        run: |
          if command -v mypy >/dev/null 2>&1; then
            mypy src/ && echo "✓ Mypy passed" || echo "[WARN] Mypy found issues"
          else
            echo "[SKIP] mypy not available"
          fi

  test:
    name: "Tests"
    runs-on: runner
    container:
      image: catthehacker/ubuntu:act-24.04
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: "Install project with dev dependencies"
        run: |
          pip3 install --break-system-packages -e ".[dev]" 2>&1
      - name: "Run unit tests"
        run: |
          python3 -m pytest tests/unit/ -v --tb=short 2>&1
